<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<title>livive.net — Demo status</title>
<style>
  :root {
    --bg: #f7f7f5; --fg: #1a1a1a; --muted: #6b6b6b; --card: #fff; --border: #e4e4df;
    --ok: #15803d; --ok-bg: #e7f6ec; --down: #b42318; --down-bg: #fdeceb;
    --chip: #f0f0ec; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101014; --fg: #ececec; --muted: #9a9aa2; --card: #17171c; --border: #26262e;
      --ok: #7ee2a3; --ok-bg: #123321; --down: #ff9a92; --down-bg: #3a1512;
      --chip: #22222a; --accent: #7aa2ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 20px 72px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { margin: 0 0 4px; font-size: 1.7rem; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  .summary { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; min-width: 130px; }
  .stat b { display: block; font-size: 1.6rem; }
  .stat span { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .07em; }
  .overall { display: inline-block; font-weight: 700; border-radius: 999px; padding: 4px 12px; font-size: .8rem;
    text-transform: uppercase; letter-spacing: .06em; }
  .overall.ok { color: var(--ok); background: var(--ok-bg); }
  .overall.degraded { color: var(--down); background: var(--down-bg); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: .92rem; }
  th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
  tr:last-child td { border-bottom: 0; }
  .pill { display: inline-block; font-size: .72rem; font-weight: 700; border-radius: 999px; padding: 2px 9px; }
  .pill.ok { color: var(--ok); background: var(--ok-bg); }
  .pill.down { color: var(--down); background: var(--down-bg); }
  code { background: var(--chip); padding: 1px 5px; border-radius: 5px; font-size: .85em; }
  .empty { color: var(--muted); padding: 24px 0; }
  footer { margin-top: 28px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Demo status</h1>
  <p class="sub">Live HTTP health of every published demo on livive.net. Generated by
    <code>_bootstrap/monitor.py</code> on a schedule.</p>
  <div id="summary" class="summary"></div>
  <div id="table"><p class="empty">Loading status…</p></div>
  <footer><a href="./">&larr; Back to projects</a></footer>
</div>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 90) return "just now";
  const m = s / 60; if (m < 90) return `${Math.round(m)} min ago`;
  const h = m / 60; if (h < 36) return `${Math.round(h)} h ago`;
  return `${Math.round(h / 24)} d ago`;
}

async function load() {
  let s;
  try {
    s = await fetch("status.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  } catch (e) {
    document.getElementById("table").innerHTML =
      `<p class="empty">Could not load <code>status.json</code> (${esc(e.message)}).</p>`;
    return;
  }
  const cls = s.status === "ok" ? "ok" : "degraded";
  document.getElementById("summary").innerHTML = `
    <div class="stat"><b>${s.live_total}</b><span>Live demos</span></div>
    <div class="stat"><b>${s.live_ok}</b><span>Healthy</span></div>
    <div class="stat"><b>${s.live_down}</b><span>Down</span></div>
    <div class="stat"><b class="overall ${cls}">${esc(s.status)}</b><span>Overall</span></div>`;

  const rows = Object.entries(s.projects || {})
    .sort((a, b) => Number(a[1].ok) - Number(b[1].ok) || a[0].localeCompare(b[0]))
    .map(([key, p]) => `<tr>
      <td><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.title)}</a>
        <div><code>${esc(key)}</code></div></td>
      <td><span class="pill ${p.ok ? "ok" : "down"}">${p.ok ? "up" : "down"}</span></td>
      <td>${p.status == null ? "—" : esc(p.status)}</td>
      <td>${p.latency_ms == null ? "—" : esc(p.latency_ms) + " ms"}</td>
      <td>${p.ok ? "" : esc(p.error || "")}</td>
    </tr>`).join("");
  document.getElementById("table").innerHTML = `
    <table>
      <thead><tr><th>Project</th><th>State</th><th>HTTP</th><th>Latency</th><th>Detail</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <footer>Last checked ${esc(s.checked_at)} (${esc(ago(s.checked_at))}).</footer>`;
}

load();
</script>
</body>
</html>
