<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>livive.net — Projects</title>
<meta name="description" content="Games, AI experiments, language tools, and prototypes — mostly playable in the browser.">
<style>
  :root {
    --bg: #f7f7f5;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --card: #ffffff;
    --border: #e4e4df;
    --accent: #2563eb;
    --live: #15803d;
    --live-bg: #e7f6ec;
    --chip: #f0f0ec;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101014;
      --fg: #ececec;
      --muted: #9a9aa2;
      --card: #17171c;
      --border: #26262e;
      --accent: #7aa2ff;
      --live: #7ee2a3;
      --live-bg: #123321;
      --chip: #22222a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  header.site { padding: 56px 0 8px; }
  header.site h1 { margin: 0 0 8px; font-size: clamp(1.9rem, 4vw, 2.6rem); letter-spacing: -.02em; }
  header.site p { margin: 0; color: var(--muted); max-width: 60ch; }

  .featured { padding: 28px 0 8px; }
  .featured h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 12px; }
  .pills { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 15px; color: var(--fg); font-weight: 600; font-size: .92rem;
    box-shadow: var(--shadow); transition: transform .12s ease, border-color .12s ease;
  }
  .pill:hover { text-decoration: none; transform: translateY(-1px); border-color: var(--accent); }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); }

  main { padding: 24px 0 72px; }
  section.cat { margin-top: 40px; }
  section.cat h2 {
    font-size: 1.15rem; margin: 0 0 16px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 10px;
  }
  section.cat h2 .count { font-size: .8rem; color: var(--muted); font-weight: 500; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }

  .card {
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; box-shadow: var(--shadow);
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card .thumb-link { display: block; }
  .card .thumb { display: block; aspect-ratio: 16 / 10; background: var(--card); overflow: hidden; }
  .card .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .card .thumb.ph {
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 1.5rem;
    letter-spacing: .04em; background: linear-gradient(135deg,
      hsl(var(--h) 55% 42%), hsl(calc(var(--h) + 40) 60% 32%));
  }
  .card .body { display: flex; flex-direction: column; flex: 1; padding: 16px 18px 18px; }
  .card .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card h3 { margin: 0; font-size: 1.02rem; line-height: 1.3; }
  .card h3 a { color: var(--fg); }
  .card .tagline { margin: 10px 0 0; color: var(--muted); font-size: .92rem; }
  .card .tags { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 14px 0 0; }
  .card .tags li { background: var(--chip); color: var(--muted); font-size: .74rem; padding: 3px 9px; border-radius: 999px; }
  .card .links { display: flex; gap: 16px; margin-top: auto; padding-top: 16px; font-weight: 600; font-size: .9rem; }

  .badge {
    flex: 0 0 auto; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--live); background: var(--live-bg); border-radius: 999px; padding: 3px 9px;
  }

  footer.site { border-top: 1px solid var(--border); padding: 28px 0 56px; color: var(--muted); font-size: .9rem; }
  .empty { color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1>Livive Projects</h1>
    <p>A collection of games, AI experiments, language tools, and prototypes — most of them playable right in your browser.</p>
  </header>

  <section class="featured" id="featured" hidden>
    <h2>Play in your browser</h2>
    <div class="pills" id="pills"></div>
  </section>

  <main id="main"><p class="empty">Loading projects…</p></main>

  <footer class="site">
    <a href="https://github.com/jpeckenpaugh" target="_blank" rel="noopener noreferrer">More on GitHub &rarr;</a>
  </footer>
</div>

<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

const initials = (s) => (String(s).match(/[A-Za-z0-9]+/g) || [])
  .slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
const hue = (s) => {
  let h = 0;
  for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
};

function card(p) {
  const title = esc(p.display_title);
  const href = p.has_live_demo ? p.live_url : p.repo_url;
  const ext = ` target="_blank" rel="noopener noreferrer"`;
  const thumb = p.thumb
    ? `<div class="thumb"><img loading="lazy" src="${esc(p.thumb)}" alt="" width="640" height="400"></div>`
    : `<div class="thumb ph" style="--h:${hue(p.key)}" aria-hidden="true">${esc(initials(p.display_title))}</div>`;
  const tags = (p.tags || []).slice(0, 5).map(t => `<li>${esc(t)}</li>`).join("");
  const live = p.has_live_demo ? `<span class="badge">Live</span>` : "";
  const play = p.has_live_demo ? `<a href="${esc(p.live_url)}"${ext}>Play &rarr;</a>` : "";
  return `<article class="card">
    <a class="thumb-link" href="${esc(href)}"${ext}>${thumb}</a>
    <div class="body">
      <div class="top"><h3><a href="${esc(href)}"${ext}>${title}</a></h3>${live}</div>
      <p class="tagline">${esc(p.tagline)}</p>
      ${tags ? `<ul class="tags">${tags}</ul>` : ""}
      <div class="links">${play}<a href="${esc(p.repo_url)}"${ext}>GitHub</a></div>
    </div>
  </article>`;
}

async function load() {
  const main = document.getElementById("main");
  let data;
  try {
    data = await fetch("projects.json", { cache: "no-cache" }).then(r => {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  } catch (e) {
    main.innerHTML = `<p class="empty">Could not load <code>projects.json</code> (${esc(e.message)}). ` +
      `If opened from the filesystem, serve the site over HTTP instead.</p>`;
    return;
  }

  const live = data.projects.filter(p => p.has_live_demo);
  if (live.length) {
    document.getElementById("featured").hidden = false;
    document.getElementById("pills").innerHTML = live
      .map(p => `<a class="pill" href="${esc(p.live_url)}" target="_blank" rel="noopener noreferrer"><span class="dot"></span>${esc(p.display_title)}</a>`)
      .join("");
  }

  main.innerHTML = data.groups.map(g => `
    <section class="cat">
      <h2>${esc(g.category)} <span class="count">${g.projects.length}</span></h2>
      <div class="grid">${g.projects.map(card).join("")}</div>
    </section>`).join("");
}

load();
</script>
</body>
</html>
