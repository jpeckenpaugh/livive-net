<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="favicon.ico">
<title>livive.net — Projects</title>
<meta name="description" content="Games, AI experiments, language tools, and prototypes — mostly playable in the browser.">
<style>
  :root {
    --bg: #f7f7f5;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --card: #ffffff;
    --border: #e4e4df;
    --accent: #2563eb;
    --live: #15803d;
    --live-bg: #e7f6ec;
    --chip: #f0f0ec;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101014;
      --fg: #ececec;
      --muted: #9a9aa2;
      --card: #17171c;
      --border: #26262e;
      --accent: #7aa2ff;
      --live: #7ee2a3;
      --live-bg: #123321;
      --chip: #22222a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header.site { padding: 56px 0 8px; }
  header.site h1 { margin: 0 0 8px; font-size: clamp(1.9rem, 4vw, 2.6rem); letter-spacing: -.02em; }
  header.site h1 a { color: var(--fg); }
  header.site p { margin: 0; color: var(--muted); max-width: 60ch; }

  .controls { padding: 26px 0 4px; display: flex; flex-direction: column; gap: 14px; }
  .search-input {
    width: 100%; font: inherit; padding: 13px 15px; color: var(--fg);
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .search-input:focus { border-color: var(--accent); }
  .filters { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 5px; font-size: .74rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .field select {
    font: inherit; font-size: .95rem; font-weight: 400; text-transform: none; letter-spacing: 0;
    color: var(--fg); background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 11px; min-width: 150px; max-width: 240px;
  }
  .field select:focus { border-color: var(--accent); }
  .btn-clear {
    font: inherit; font-weight: 600; color: var(--fg); background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 15px; cursor: pointer;
  }
  .btn-clear:hover { border-color: var(--accent); }
  .result-count { margin: 0; color: var(--muted); font-size: .85rem; min-height: 1.2em; }

  .featured { padding: 28px 0 8px; }
  .featured h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 12px; }
  .pills { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 15px; color: var(--fg); font-weight: 600; font-size: .92rem;
    box-shadow: var(--shadow); transition: transform .12s ease, border-color .12s ease;
  }
  .pill:hover { text-decoration: none; transform: translateY(-1px); border-color: var(--accent); }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); }

  main { padding: 24px 0 72px; }
  section.cat { margin-top: 40px; }
  section.cat h2 {
    font-size: 1.15rem; margin: 0 0 16px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 10px;
  }
  section.cat h2 .count { font-size: .8rem; color: var(--muted); font-weight: 500; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }

  .card {
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; box-shadow: var(--shadow);
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card .thumb-link { display: block; }
  .thumb { display: block; aspect-ratio: 16 / 10; background: var(--card); overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb.ph {
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 1.5rem;
    letter-spacing: .04em; background: linear-gradient(135deg,
      hsl(var(--h) 55% 42%), hsl(calc(var(--h) + 40) 60% 32%));
  }
  .card .body { display: flex; flex-direction: column; flex: 1; padding: 16px 18px 18px; }
  .card .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card h3 { margin: 0; font-size: 1.02rem; line-height: 1.3; }
  .card h3 a { color: var(--fg); }
  .card .tagline { margin: 10px 0 0; color: var(--muted); font-size: .92rem; }
  .card .tags { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 14px 0 0; }
  .card .tags li { background: var(--chip); color: var(--muted); font-size: .74rem; padding: 3px 9px; border-radius: 999px; }
  .card .links { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: auto; padding-top: 16px; font-weight: 600; font-size: .9rem; }

  .badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .badge {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
    font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--live); background: var(--live-bg); border-radius: 999px; padding: 3px 9px;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .badge.status { color: var(--muted); background: var(--chip); }
  .badge.status .dot { background: var(--live); }

  .detail { padding-top: 4px; }
  .back { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 20px; }
  .detail h2 { margin: 0; font-size: clamp(1.6rem, 3.6vw, 2.2rem); letter-spacing: -.015em; outline: none; }
  .detail .lead { font-size: 1.08rem; color: var(--muted); margin: 10px 0 0; max-width: 65ch; }
  .detail-hero { margin: 22px 0 0; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  .detail-hero .thumb.ph { font-size: 2.4rem; }
  .detail-section { margin-top: 30px; }
  .detail-section > h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 10px; }
  .detail-section p { margin: 0; max-width: 72ch; }
  .chips { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; }
  .chips li { background: var(--chip); color: var(--fg); font-size: .82rem; padding: 5px 11px; border-radius: 999px; }
  .detail-links { display: flex; flex-wrap: wrap; gap: 10px 20px; font-weight: 600; }
  .detail-meta { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 8px; color: var(--muted); font-size: .9rem; }
  .detail-meta strong { color: var(--fg); font-weight: 600; }

  footer.site { border-top: 1px solid var(--border); padding: 28px 0 56px; color: var(--muted); font-size: .9rem; }
  .empty { color: var(--muted); padding: 40px 0; }
  .linklike { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1><a href="#" id="home-link">Livive Projects</a></h1>
    <p>A collection of games, AI experiments, language tools, and prototypes — most of them playable right in your browser.</p>
  </header>

  <div class="controls" id="controls" hidden>
    <div>
      <label class="sr-only" for="q">Search projects</label>
      <input class="search-input" id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search title, tagline, tags, tech…" aria-controls="main">
    </div>
    <div class="filters">
      <label class="field" for="f-category">Category
        <select id="f-category"><option value="">All</option></select>
      </label>
      <label class="field" for="f-tag">Tag
        <select id="f-tag"><option value="">All</option></select>
      </label>
      <label class="field" for="f-tech">Tech
        <select id="f-tech"><option value="">All</option></select>
      </label>
      <label class="field" for="f-status">Status
        <select id="f-status"><option value="">All</option></select>
      </label>
      <button class="btn-clear" id="clear" type="button">Clear</button>
    </div>
    <p class="result-count" id="count" role="status" aria-live="polite"></p>
  </div>

  <section class="featured" id="featured" hidden>
    <h2>Play in your browser</h2>
    <div class="pills" id="pills"></div>
  </section>

  <main id="main">
    <p class="empty">Loading projects…</p>
    <noscript><p class="empty">This hub needs JavaScript to list projects. You can browse the source on
      <a href="https://github.com/jpeckenpaugh">GitHub</a> instead.</p></noscript>
  </main>

  <footer class="site">
    <a href="https://github.com/jpeckenpaugh" target="_blank" rel="noopener noreferrer">More on GitHub &rarr;</a>
  </footer>
</div>

<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));
const initials = (s) => (String(s).match(/[A-Za-z0-9]+/g) || [])
  .slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
const hue = (s) => {
  let h = 0;
  for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
};

const EXT = ` target="_blank" rel="noopener noreferrer"`;
const projectHref = (p) => `#project=${encodeURIComponent(p.key)}`;

// Descriptive alt text derived from the project data so thumbnail images are never unlabeled.
const thumbAlt = (p) => {
  const bits = [p.display_title];
  if (p.tagline) bits.push(p.tagline);
  else if (p.category) bits.push(p.category + " project");
  return esc(bits.join(" — ").slice(0, 240));
};

const thumbHtml = (p) => p.thumb
  ? `<div class="thumb"><img loading="lazy" src="${esc(p.thumb)}" alt="${thumbAlt(p)}" width="640" height="400"></div>`
  : `<div class="thumb ph" style="--h:${hue(p.key)}" aria-hidden="true">${esc(initials(p.display_title))}</div>`;

function statusChip(p) {
  const dot = p.has_live_demo ? `<span class="dot" aria-hidden="true"></span>` : "";
  const label = esc(p.status || "unknown");
  return `<span class="badge status" title="Status: ${label}">${dot}${label}</span>`;
}

function card(p) {
  const title = esc(p.display_title);
  const href = projectHref(p);
  const tags = (p.tags || []).slice(0, 5).map(t => `<li>${esc(t)}</li>`).join("");
  const demos = (p.demos && p.demos.length) ? p.demos
    : (p.has_live_demo ? [{ label: "Play", url: p.live_url }] : []);
  const play = demos.map(dm => `<a href="${esc(dm.url)}"${EXT}>${esc(dm.label)} &rarr;</a>`).join("");
  return `<article class="card">
    <a class="thumb-link" href="${href}" aria-label="View details for ${title}">${thumbHtml(p)}</a>
    <div class="body">
      <div class="top"><h3><a href="${href}">${title}</a></h3><div class="badges">${statusChip(p)}</div></div>
      <p class="tagline">${esc(p.tagline)}</p>
      ${tags ? `<ul class="tags">${tags}</ul>` : ""}
      <div class="links"><a class="details" href="${href}">Details</a>${play}<a href="${esc(p.repo_url)}"${EXT}>GitHub</a></div>
    </div>
  </article>`;
}

// ---- state -----------------------------------------------------------------
let DATA = null;
const state = { q: "", category: "", tag: "", tech: "", status: "" };

const anyFilter = () => !!(state.q.trim() || state.category || state.tag || state.tech || state.status);

function haystack(p) {
  return [
    p.display_title, p.tagline,
    (p.tags || []).join(" "), (p.tech || []).join(" "),
  ].join(" ").toLowerCase();
}

function matches(p) {
  const q = state.q.trim().toLowerCase();
  if (q && !q.split(/\s+/).every(tok => haystack(p).includes(tok))) return false;
  if (state.category && p.category !== state.category) return false;
  if (state.tag && !(p.tags || []).includes(state.tag)) return false;
  if (state.tech && !(p.tech || []).includes(state.tech)) return false;
  if (state.status && p.status !== state.status) return false;
  return true;
}

// ---- index view ------------------------------------------------------------
function renderIndex() {
  const main = document.getElementById("main");
  const featured = document.getElementById("featured");
  const filtering = anyFilter();

  document.getElementById("controls").hidden = false;
  document.title = "livive.net — Projects";

  featured.hidden = filtering || !DATA.projects.some(p => p.has_live_demo);

  if (!filtering) {
    main.innerHTML = DATA.groups.map(g => `
      <section class="cat">
        <h2>${esc(g.category)} <span class="count">${g.projects.length}</span></h2>
        <div class="grid">${g.projects.map(card).join("")}</div>
      </section>`).join("");
    updateCount();
    return;
  }

  const results = DATA.projects.filter(matches);
  main.innerHTML = results.length
    ? `<section class="cat">
        <h2>Results <span class="count">${results.length}</span></h2>
        <div class="grid">${results.map(card).join("")}</div>
      </section>`
    : `<p class="empty">No projects match your search or filters.
         <button type="button" class="linklike" id="reset-empty">Clear filters</button></p>`;
  updateCount();
  const reset = document.getElementById("reset-empty");
  if (reset) reset.addEventListener("click", clearFilters);
}

function updateCount() {
  const el = document.getElementById("count");
  if (!DATA) return;
  const n = anyFilter() ? DATA.projects.filter(matches).length : DATA.projects.length;
  el.textContent = anyFilter()
    ? `${n} of ${DATA.projects.length} project${DATA.projects.length === 1 ? "" : "s"}`
    : `${n} project${n === 1 ? "" : "s"}`;
}

// ---- detail view -----------------------------------------------------------
function renderDetail(rawKey) {
  const main = document.getElementById("main");
  document.getElementById("controls").hidden = true;
  document.getElementById("featured").hidden = true;
  document.getElementById("count").textContent = "";

  const key = String(rawKey || "");
  const p = DATA.projects.find(x => x.key === key)
    || DATA.projects.find(x => x.key.toLowerCase() === key.toLowerCase());

  if (!p) {
    document.title = "Project not found — livive.net";
    main.innerHTML = `<article class="detail">
      <a class="back" href="#">&larr; All projects</a>
      <h2 tabindex="-1">Project not found</h2>
      <p class="lead">No project matches <code>${esc(key)}</code>. It may have been renamed or removed.</p>
    </article>`;
    focusHeading();
    return;
  }

  document.title = `${p.display_title} — livive.net`;
  const demos = (p.demos && p.demos.length) ? p.demos
    : (p.has_live_demo ? [{ label: "Play", url: p.live_url }] : []);
  const demoLinks = demos.map(dm => `<a href="${esc(dm.url)}"${EXT}>${esc(dm.label)} &rarr;</a>`).join("");
  const tech = (p.tech || []).length
    ? `<ul class="chips">${p.tech.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : "";
  const tags = (p.tags || []).length
    ? `<ul class="chips">${p.tags.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : "";
  const description = p.long_description || p.short_description || p.tagline || "";

  main.innerHTML = `<article class="detail">
    <a class="back" href="#">&larr; All projects</a>
    <div class="top" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
      <h2 tabindex="-1">${esc(p.display_title)}</h2>
      <div class="badges">${statusChip(p)}</div>
    </div>
    <p class="lead">${esc(p.tagline)}</p>
    <div class="detail-hero">${thumbHtml(p)}</div>
    ${description ? `<div class="detail-section"><h3>About</h3><p>${esc(description)}</p></div>` : ""}
    ${p.short_description && p.long_description ? `<div class="detail-section"><h3>Summary</h3><p>${esc(p.short_description)}</p></div>` : ""}
    ${tech ? `<div class="detail-section"><h3>Tech</h3>${tech}</div>` : ""}
    ${tags ? `<div class="detail-section"><h3>Tags</h3>${tags}</div>` : ""}
    <div class="detail-section">
      <h3>Links</h3>
      <div class="detail-links">
        ${demoLinks}
        <a href="${esc(p.repo_url)}"${EXT}>GitHub repository &rarr;</a>
      </div>
    </div>
    <div class="detail-meta">
      <span>Category: <strong>${esc(p.category || "—")}</strong></span>
      <span>Status: <strong>${esc(p.status || "—")}</strong></span>
    </div>
  </article>`;
  focusHeading();
}

function focusHeading() {
  const h = document.querySelector("#main h2[tabindex]");
  if (h) h.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

// ---- controls --------------------------------------------------------------
function fillSelect(id, values) {
  const sel = document.getElementById(id);
  for (const v of values) {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    sel.appendChild(opt);
  }
}

function clearFilters() {
  state.q = ""; state.category = ""; state.tag = ""; state.tech = ""; state.status = "";
  document.getElementById("q").value = "";
  for (const id of ["f-category", "f-tag", "f-tech", "f-status"]) document.getElementById(id).value = "";
  if (location.hash.includes("project=")) location.hash = "";
  else renderIndex();
}

function bindControls() {
  const q = document.getElementById("q");
  q.addEventListener("input", () => { state.q = q.value; renderIndex(); });
  const map = {
    "f-category": "category", "f-tag": "tag", "f-tech": "tech", "f-status": "status",
  };
  for (const [id, field] of Object.entries(map)) {
    const el = document.getElementById(id);
    el.addEventListener("change", () => { state[field] = el.value; renderIndex(); });
  }
  document.getElementById("clear").addEventListener("click", clearFilters);
}

// ---- router ----------------------------------------------------------------
function route() {
  if (!DATA) return;
  const params = new URLSearchParams(location.hash.replace(/^#/, ""));
  const key = params.get("project");
  if (key) renderDetail(key);
  else renderIndex();
}

async function load() {
  const main = document.getElementById("main");
  try {
    const res = await fetch("projects.json", { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
  } catch (e) {
    main.innerHTML = `<p class="empty">Could not load <code>projects.json</code> (${esc(e.message)}). ` +
      `If opened from the filesystem, serve the site over HTTP instead.</p>`;
    return;
  }

  const live = DATA.projects.filter(p => p.has_live_demo);
  if (live.length) {
    document.getElementById("pills").innerHTML = live
      .map(p => `<a class="pill" href="${esc(p.live_url)}" target="_blank" rel="noopener noreferrer"><span class="dot"></span>${esc(p.display_title)}</a>`)
      .join("");
  }

  fillSelect("f-category", [...new Set(DATA.projects.map(p => p.category))].filter(Boolean).sort());
  fillSelect("f-tag", [...new Set(DATA.projects.flatMap(p => p.tags || []))].filter(Boolean).sort());
  fillSelect("f-tech", [...new Set(DATA.projects.flatMap(p => p.tech || []))].filter(Boolean).sort());
  fillSelect("f-status", [...new Set(DATA.projects.map(p => p.status))].filter(Boolean).sort());

  bindControls();
  document.getElementById("home-link").href = "#";
  window.addEventListener("hashchange", route);
  route();
}

load();
</script>
</body>
</html>
